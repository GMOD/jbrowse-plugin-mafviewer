name: Integration

on:
  push:
  schedule:
    - cron: '0 9 * * 1'

jobs:
  build-and-lint:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
  e2e-tests:
    name: E2E tests (nightly)
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome
      - name: Install JBrowse CLI
        run: pnpm install -g @jbrowse/cli
      - name: Setup JBrowse nightly
        run: jbrowse create .test-jbrowse-nightly --nightly
      - name: Run E2E tests
        run: TEST_JBROWSE_VERSION=nightly pnpm vitest run test/
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-nightly
          path: test-screenshots/
      - name: Upload image snapshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-diffs-nightly
          path: test/__image_snapshots__/__diff_output__/
